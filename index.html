<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tourn.lol — one link for everything you play</title>
    <meta
      name="description"
      content="tourn.lol is a bio link for people who play. One short link with your Discord, your server, your Spotify and your Steam profile, kept live automatically."
    />
    <meta name="theme-color" content="#02070d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="tourn.lol — one link for everything you play" />
    <meta
      property="og:description"
      content="Claim your handle. Discord, your server, Spotify and Steam stay live on one clean bio page."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      Runtime public env, served by the Railway backend. This is the ONLY
      place the frontend gets its configuration on a static host — no env
      vars are set in Vercel/Netlify. The backend whitelists what it exposes
      (Supabase URL + anon key + owner email + public client ids) and
      nothing secret ever appears here. Falls back to .env in local dev.
    -->
    <script src="https://tourn-production.up.railway.app/env.js"></script>
  </head>
  <body>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          translate: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
