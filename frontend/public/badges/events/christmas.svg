<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Christmas">
  <defs>
    <!-- Candy cane clip path for stripes -->
    <clipPath id="candy-cane-clip">
      <path d="M26 58V24c0-6.627 5.373-12 12-12s12 5.373 12 12v6c0 2.21-1.79 4-4 4s-4-1.79-4-4v-6c0-2.209-1.791-4-4-4s-4 1.791-4 4v34c0 2.209-1.791 4-4 4s-4-1.791-4-4Z" />
    </clipPath>
    <!-- Soft glow -->
    <filter id="cc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient festive glow -->
  <path d="M26 58V24c0-6.627 5.373-12 12-12s12 5.373 12 12v6c0 2.21-1.79 4-4 4s-4-1.79-4-4v-6c0-2.209-1.791-4-4-4s-4 1.791-4 4v34c0 2.209-1.791 4-4 4s-4-1.791-4-4Z" fill="#ef4444" opacity="0.3" filter="url(#cc-glow)" />

  <!-- Candy Cane Main Body (Red Base) -->
  <path d="M26 58V24c0-6.627 5.373-12 12-12s12 5.373 12 12v6c0 2.21-1.79 4-4 4s-4-1.79-4-4v-6c0-2.209-1.791-4-4-4s-4 1.791-4 4v34c0 2.209-1.791 4-4 4s-4-1.791-4-4Z" fill="#dc2626" />

  <!-- Crisp White Slanted Stripes -->
  <g clip-path="url(#candy-cane-clip)">
    <!-- Diagonal white stripes across body -->
    <path d="M15 62l25-25h8l-25 25Z" fill="#ffffff" />
    <path d="M15 48l25-25h8l-25 25Z" fill="#ffffff" />
    <path d="M15 34l25-25h8l-25 25Z" fill="#ffffff" />
    <path d="M22 20l25-25h8l-25 25Z" fill="#ffffff" />
    <path d="M34 14l20-20h7l-20 20Z" fill="#ffffff" />
    <path d="M42 22l18-18h7l-18 18Z" fill="#ffffff" />
    <path d="M44 34l16-16h7l-16 16Z" fill="#ffffff" />
    <!-- Fine red accent pinstripes -->
    <path d="M15 57l25-25h2l-25 25Z" fill="#b91c1c" />
    <path d="M15 43l25-25h2l-25 25Z" fill="#b91c1c" />
    <path d="M15 29l25-25h2l-25 25Z" fill="#b91c1c" />
  </g>

  <!-- Glossy 3D Highlight Curve -->
  <path d="M28 56V24c0-5.5 4.5-10 10-10s10 4.5 10 10v6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

  <!-- Sparkle stars -->
  <polygon points="48,10 50,13 53,14 50,15 48,18 46,15 43,14 46,13" fill="#ffffff" opacity="0.9" filter="url(#cc-glow)" />
  <polygon points="18,36 19.5,38 21.5,38.5 19.5,39 18,41 16.5,39 14.5,38.5 16.5,38" fill="#ffffff" opacity="0.8" />
</svg>
