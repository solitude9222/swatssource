<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Christmas">
  <defs>
    <!-- Christmas Bauble Glow -->
    <filter id="xm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Deep Lustrous Ruby Ornament Gradient -->
    <radialGradient id="xm-ruby" cx="35%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="20%" stop-color="#f43f5e" />
      <stop offset="55%" stop-color="#be123c" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <!-- Metallic Gold Cap & Ring -->
    <linearGradient id="xm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <!-- Ice Crystal Snowflake Glow -->
    <linearGradient id="xm-ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Ambient festive glow -->
  <circle cx="32" cy="38" r="22" fill="#e11d48" opacity="0.25" filter="url(#xm-glow)" />

  <!-- Gold Hanging Loop and Filigree Cap -->
  <path d="M32 3c-3 0-5 2.5-5 5.5s2 5.5 5 5.5 5-2.5 5-5.5S35 3 32 3Z" fill="none" stroke="url(#xm-gold)" stroke-width="2.2" />
  <rect x="24" y="11" width="16" height="7" rx="2" fill="url(#xm-gold)" stroke="#78350f" stroke-width="0.8" />
  <!-- Cap scalloped rim -->
  <path d="M24 18c2 2 4 0 4 0s2 2 4 0 2 2 4 0 2 2 4 0" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />

  <!-- The Spherical Ruby Bauble -->
  <circle cx="32" cy="39" r="21" fill="url(#xm-ruby)" />

  <!-- Specular Glass Highlights -->
  <ellipse cx="23" cy="28" rx="8" ry="4" transform="rotate(-30 23 28)" fill="#ffffff" opacity="0.55" filter="url(#xm-glow)" />
  <ellipse cx="23" cy="28" rx="4" ry="2" transform="rotate(-30 23 28)" fill="#ffffff" opacity="0.9" />
  <path d="M47 48c2-4 3-8 3-13" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.25" />

  <!-- Elaborate Crystalline Holiday Snowflake on Bauble -->
  <g stroke="url(#xm-ice)" stroke-linecap="round" filter="url(#xm-glow)">
    <!-- 6 Primary Snowflake Axes -->
    <path d="M32 26v26M19 32.5l26 13M19 45.5l26-13" stroke-width="1.8" />
    
    <!-- Snowflake Crystal Branching Chevrons -->
    <!-- Vertical Branches -->
    <path d="M29 30l3-3 3 3M29 48l3 3 3-3" stroke-width="1.4" />
    <!-- Diagonal Branches 1 -->
    <path d="M23 32l1 4 4-1M39 42l-4 1-1-4" stroke-width="1.4" />
    <!-- Diagonal Branches 2 -->
    <path d="M23 46l4-1 1 4M39 36l-1-4-4 1" stroke-width="1.4" />
  </g>

  <!-- Central Snowflake Diamond Core -->
  <circle cx="32" cy="39" r="3" fill="#ffffff" filter="url(#xm-glow)" />
  <circle cx="32" cy="39" r="1.5" fill="#38bdf8" />

  <!-- Diamond Sparkle Stars -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Top right sparkle -->
    <polygon points="50,22 52,26 56,27 52,28 50,32 48,28 44,27 48,26" filter="url(#xm-glow)" />
    <!-- Small bottom left sparkle -->
    <polygon points="14,48 15,50 17,50.5 15,51 14,53 13,51 11,50.5 13,50" opacity="0.8" />
  </g>
</svg>
