<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Christmas Event Badge">
  <defs>
    <!-- Tree Pine Gradient -->
    <linearGradient id="xmas-tree" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="xmas-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Star Glow Bloom Filter -->
    <filter id="xmas-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Tree Base Shadow -->
  <ellipse cx="32" cy="60" rx="18" ry="3.5" fill="#000000" opacity="0.35" />

  <!-- Trunk -->
  <rect x="29" y="52" width="6" height="8" rx="1.5" fill="#78350f" />

  <!-- Tree Layer 3 (Bottom Tier) -->
  <path d="M12 52c3-1 8-2 12-1 0 0-3-4-2-6 5 0 9-1 12 0 0 0-2 4-1 6 4-1 9 0 11 1-1.5-2-4-7-5.5-9-3 1-5.5 1-8.5 0.5 0.5-2 1-3 1.5-4.5-5 0.5-8 0.5-13 0 0.5 1.5 1 2.5 1.5 4.5-3 0.5-5.5 0.5-8.5-0.5-1.5 2-4 7-5.5 9Z" fill="none" />
  
  <path d="M32 38L14 53c3.5-1 8-1.5 12-0.5-1.5-3-0.5-5.5 0.5-6.5 4 0.5 7.5 0.5 11 0 1 1 2 3.5 0.5 6.5 4-1 8.5-0.5 12 0.5L32 38Z" fill="url(#xmas-tree)" />
  
  <!-- Tree Layer 2 (Middle Tier) -->
  <path d="M32 25L19 39c3-0.8 6.5-1 10-0.3-1.2-2.5-0.4-4.5 0.4-5.5 3.2 0.5 6 0.5 9 0 0.8 1 1.6 3 0.4 5.5 3.5-0.7 7-0.5 10 0.3L32 25Z" fill="url(#xmas-tree)" />

  <!-- Tree Layer 1 (Top Tier) -->
  <path d="M32 14L24 26c2.5-0.6 5-0.8 7.5-0.3 0.5 0 1 0 1 0s0.5 0 1 0c2.5-0.5 5-0.3 7.5 0.3L32 14Z" fill="url(#xmas-tree)" />

  <!-- Festive Garland Lines -->
  <path d="M26 24c3 3 8 3 11 0" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <path d="M22 36c5 4 15 4 20 0" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <path d="M18 49c8 5 20 5 28 0" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- Bauble Ornaments (Ruby, Gold, Sapphire) -->
  <circle cx="23" cy="25" r="2" fill="#ef4444" />
  <circle cx="22.5" cy="24.5" r="0.6" fill="#ffffff" />

  <circle cx="40" cy="26" r="1.8" fill="#38bdf8" />
  <circle cx="39.5" cy="25.5" r="0.5" fill="#ffffff" />

  <circle cx="21" cy="38" r="2.2" fill="#f59e0b" />
  <circle cx="20.5" cy="37.5" r="0.7" fill="#ffffff" />

  <circle cx="33" cy="34" r="2" fill="#ef4444" />
  <circle cx="32.5" cy="33.5" r="0.6" fill="#ffffff" />

  <circle cx="43" cy="38" r="2.2" fill="#ec4899" />
  <circle cx="42.5" cy="37.5" r="0.7" fill="#ffffff" />

  <circle cx="18" cy="51" r="2.4" fill="#38bdf8" />
  <circle cx="17.4" cy="50.4" r="0.8" fill="#ffffff" />

  <circle cx="31" cy="47" r="2.2" fill="#fbbf24" />
  <circle cx="30.5" cy="46.5" r="0.7" fill="#ffffff" />

  <circle cx="45" cy="51" r="2.4" fill="#ef4444" />
  <circle cx="44.4" cy="50.4" r="0.8" fill="#ffffff" />

  <!-- Radiant Golden Star Topper -->
  <g filter="url(#xmas-glow)">
    <polygon points="32,4 34.5,11 42,11.5 36,16 38.5,23 32,18.5 25.5,23 28,16 22,11.5 29.5,11" fill="url(#xmas-gold)" />
    <circle cx="32" cy="14" r="2" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
