<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="New Year Celebration Badge">
  <defs>
    <!-- Radiant Starburst Gold Gradient -->
    <radialGradient id="ny-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Outer Fireworks Sparkle Gradient -->
    <linearGradient id="ny-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ambient Sparkle Glow Filter -->
    <filter id="ny-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Core -->
  <circle cx="32" cy="32" r="28" fill="#f59e0b" opacity="0.15" filter="url(#ny-glow)" />

  <!-- Fireworks Ray Beams (12 Radiating Rays) -->
  <g stroke="url(#ny-beam)" stroke-linecap="round" opacity="0.85">
    <!-- North & South -->
    <line x1="32" y1="5" x2="32" y2="15" stroke-width="2.4" />
    <line x1="32" y1="49" x2="32" y2="59" stroke-width="2.4" />
    <!-- East & West -->
    <line x1="5" y1="32" x2="15" y2="32" stroke-width="2.4" />
    <line x1="49" y1="32" x2="59" y2="32" stroke-width="2.4" />

    <!-- Diagonal Major Rays -->
    <line x1="13" y1="13" x2="20" y2="20" stroke-width="2.2" />
    <line x1="51" y1="13" x2="44" y2="20" stroke-width="2.2" />
    <line x1="13" y1="51" x2="20" y2="44" stroke-width="2.2" />
    <line x1="51" y1="51" x2="44" y2="44" stroke-width="2.2" />

    <!-- Secondary Accent Rays -->
    <line x1="21" y1="8" x2="25" y2="17" stroke-width="1.6" opacity="0.7" />
    <line x1="43" y1="8" x2="39" y2="17" stroke-width="1.6" opacity="0.7" />
    <line x1="21" y1="56" x2="25" y2="47" stroke-width="1.6" opacity="0.7" />
    <line x1="43" y1="56" x2="39" y2="47" stroke-width="1.6" opacity="0.7" />
    <line x1="8" y1="21" x2="17" y2="25" stroke-width="1.6" opacity="0.7" />
    <line x1="8" y1="43" x2="17" y2="39" stroke-width="1.6" opacity="0.7" />
    <line x1="56" y1="21" x2="47" y2="25" stroke-width="1.6" opacity="0.7" />
    <line x1="56" y1="43" x2="47" y2="39" stroke-width="1.6" opacity="0.7" />
  </g>

  <!-- Celebration Floating Sparkle Diamonds -->
  <polygon points="12,24 13.5,27 16,28 13.5,29 12,32 10.5,29 8,28 10.5,27" fill="#fde047" />
  <polygon points="52,24 53.5,27 56,28 53.5,29 52,32 50.5,29 48,28 50.5,27" fill="#fde047" />
  <polygon points="26,10 27,12 29,12.5 27,13 26,15 25,13 23,12.5 25,12" fill="#ffffff" />
  <polygon points="38,10 39,12 41,12.5 39,13 38,15 37,13 35,12.5 37,12" fill="#ffffff" />
  <polygon points="24,54 25,56 27,56.5 25,57 24,59 23,57 21,56.5 23,56" fill="#fef08a" />
  <polygon points="40,54 41,56 43,56.5 41,57 40,59 39,57 37,56.5 39,56" fill="#fef08a" />

  <!-- Confetti / Festive Sparks -->
  <circle cx="10" cy="18" r="1.3" fill="#a855f7" />
  <circle cx="54" cy="18" r="1.3" fill="#ec4899" />
  <circle cx="9" cy="46" r="1.3" fill="#38bdf8" />
  <circle cx="55" cy="46" r="1.3" fill="#10b981" />
  <circle cx="28" cy="4" r="1.2" fill="#fbbf24" />
  <circle cx="36" cy="60" r="1.2" fill="#fbbf24" />

  <!-- Central Radiant Golden 8-Point Star -->
  <g filter="url(#ny-glow)">
    <!-- 8-Point Primary Star -->
    <path d="M32 16 L35.5 27 L46.5 24 L39 32 L46.5 40 L35.5 37 L32 48 L28.5 37 L17.5 40 L25 32 L17.5 24 L28.5 27 Z" fill="url(#ny-burst)" />
    <!-- Secondary 4-Point Sharp Cross Core -->
    <polygon points="32,20 34.5,30 44,32 34.5,34 32,44 29.5,34 20,32 29.5,30" fill="#ffffff" opacity="0.9" />
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>
