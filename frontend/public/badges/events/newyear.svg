<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="New Year 2027 Rocket">
  <defs>
    <!-- Soft glow -->
    <filter id="rocket-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Rocket metallic hull gradient -->
    <linearGradient id="rocket-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <!-- Flame plume gradient -->
    <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Ambient fiery stardust trail -->
  <g filter="url(#rocket-glow)">
    <!-- Exhaust flame thrust -->
    <polygon points="17,47 13,58 20,53 23,61 24,49" fill="url(#rocket-flame)" />
    <!-- Stardust celebration sparks -->
    <circle cx="8" cy="59" r="1.5" fill="#facc15" />
    <circle cx="14" cy="62" r="1.2" fill="#fb923c" />
    <circle cx="27" cy="59" r="1.2" fill="#facc15" />
    <circle cx="56" cy="12" r="2" fill="#fde047" />
    <circle cx="48" cy="6" r="1.2" fill="#38bdf8" />
    <circle cx="12" cy="22" r="1.4" fill="#a855f7" />
  </g>

  <!-- Group rotated 45 deg around center -->
  <g transform="rotate(45 32 32)">
    <!-- Left and right fins -->
    <polygon points="23,40 16,50 25,47" fill="#ef4444" />
    <polygon points="41,40 48,50 39,47" fill="#ef4444" />

    <!-- Rocket Body / Fuselage -->
    <rect x="24" y="20" width="16" height="28" rx="4" fill="url(#rocket-hull)" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Red / Gold stripe band -->
    <rect x="24" y="27" width="16" height="3" fill="#ef4444" />
    <rect x="24" y="30" width="16" height="1.5" fill="#facc15" />

    <!-- 2027 Inscription along the rocket body -->
    <text
      x="32"
      y="42"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="8"
      font-weight="900"
      letter-spacing="0.5"
      fill="#0f172a"
      text-anchor="middle"
    >2027</text>

    <!-- Nose cone -->
    <path d="M24 20c0-9 8-14 8-14s8 5 8 14Z" fill="#ef4444" />
    <!-- Nose cone shine highlight -->
    <path d="M27 18c2-4 5-8 5-8" fill="none" stroke="#fca5a5" stroke-width="1.2" stroke-linecap="round" />

    <!-- Rocket engine nozzle at base -->
    <polygon points="27,48 37,48 35,52 29,52" fill="#334155" />
  </g>

  <!-- Sparkle stars in sky -->
  <polygon points="52,18 53.5,21 56,22 53.5,23 52,26 50.5,23 48,22 50.5,21" fill="#ffffff" filter="url(#rocket-glow)" />
  <polygon points="16,14 17,16 19,16.5 17,17 16,19 15,17 13,16.5 15,16" fill="#fef08a" opacity="0.85" />
</svg>
