<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="New Year">
  <defs>
    <!-- Firework Glow -->
    <filter id="ny-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Midnight Celestial Disk -->
    <radialGradient id="ny-night" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <!-- Core Celebration Firework Gradient -->
    <radialGradient id="ny-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
    <!-- Golden Star Sparkle Gradient -->
    <linearGradient id="ny-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Sphere Background with Golden Rim -->
  <circle cx="32" cy="32" r="29" fill="url(#ny-night)" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Outer Festive Stardust Trails -->
  <g stroke="url(#ny-gold)" stroke-linecap="round" filter="url(#ny-glow)">
    <!-- Primary 8 Firework Beams -->
    <line x1="32" y1="7" x2="32" y2="21" stroke-width="2.6" />
    <line x1="32" y1="43" x2="32" y2="57" stroke-width="2.6" />
    <line x1="7" y1="32" x2="21" y2="32" stroke-width="2.6" />
    <line x1="43" y1="32" x2="57" y2="32" stroke-width="2.6" />
    
    <line x1="14.3" y1="14.3" x2="24.2" y2="24.2" stroke-width="2.2" />
    <line x1="39.8" y1="39.8" x2="49.7" y2="49.7" stroke-width="2.2" />
    <line x1="49.7" y1="14.3" x2="39.8" y2="24.2" stroke-width="2.2" />
    <line x1="24.2" y1="39.8" x2="14.3" y2="49.7" stroke-width="2.2" />
  </g>

  <!-- Neon Cyan & Magenta Secondary Stardust Sparks -->
  <g filter="url(#ny-glow)">
    <circle cx="32" cy="9" r="2" fill="#22d3ee" />
    <circle cx="32" cy="55" r="2" fill="#22d3ee" />
    <circle cx="9" cy="32" r="2" fill="#f43f5e" />
    <circle cx="55" cy="32" r="2" fill="#f43f5e" />

    <circle cx="16" cy="16" r="1.8" fill="#a855f7" />
    <circle cx="48" cy="16" r="1.8" fill="#22d3ee" />
    <circle cx="16" cy="48" r="1.8" fill="#f43f5e" />
    <circle cx="48" cy="48" r="1.8" fill="#a855f7" />

    <circle cx="23" cy="13" r="1.4" fill="#fbbf24" />
    <circle cx="41" cy="13" r="1.4" fill="#fbbf24" />
    <circle cx="51" cy="23" r="1.4" fill="#67e8f9" />
    <circle cx="51" cy="41" r="1.4" fill="#67e8f9" />
    <circle cx="41" cy="51" r="1.4" fill="#fbbf24" />
    <circle cx="23" cy="51" r="1.4" fill="#fbbf24" />
    <circle cx="13" cy="41" r="1.4" fill="#f43f5e" />
    <circle cx="13" cy="23" r="1.4" fill="#f43f5e" />
  </g>

  <!-- Radiant Golden Explosion Ring -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.75" />

  <!-- Dazzling Four-Point Diamond Celebration Star (Centerpiece) -->
  <g fill="url(#ny-burst)" filter="url(#ny-glow)">
    <polygon points="32,18 35,29 46,32 35,35 32,46 29,35 18,32 29,29" />
  </g>

  <!-- Brilliant Pure White Diamond Core -->
  <polygon points="32,23 34,30 41,32 34,34 32,41 30,34 23,32 30,30" fill="#ffffff" />
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" filter="url(#ny-glow)" />

  <!-- Sparkling Celebration Bubbles -->
  <circle cx="27" cy="20" r="1" fill="#ffffff" opacity="0.9" />
  <circle cx="37" cy="44" r="1" fill="#ffffff" opacity="0.9" />
</svg>
