<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Halloween">
  <defs>
    <!-- Mask to punch transparent eyes, nose and mouth holes through the pumpkin -->
    <mask id="pumpkin-carve-mask">
      <!-- Everything white is kept -->
      <rect x="0" y="0" width="64" height="64" fill="#ffffff" />
      
      <!-- Black shapes are cut out to transparent -->
      <!-- Left Eye cutout -->
      <polygon points="21,30 29,33 24,39" fill="#000000" />
      <!-- Right Eye cutout -->
      <polygon points="43,30 35,33 40,39" fill="#000000" />
      <!-- Nose Triangle cutout -->
      <polygon points="32,36 29,42 35,42" fill="#000000" />
      <!-- Jagged Smile cutout -->
      <path d="M18 45c3 7 10 11 14 11s11-4 14-11c-3 2-5 3-7 3l-1-3-3 2-3-2-3 2-1-3c-2 0-4-1-6-3Z" fill="#000000" />
    </mask>

    <radialGradient id="hw-orange" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <linearGradient id="hw-stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
  </defs>

  <!-- Stem at top -->
  <path d="M31 20c-1-6 2-11 6-13 1 2 0 5-1 7 2-1 4 0 5 2-2 3-4 4-6 5l-4-1Z" fill="url(#hw-stem-grad)" />

  <!-- Pumpkin silhouette with transparent carved cutouts -->
  <g mask="url(#pumpkin-carve-mask)">
    <!-- Ambient orange silhouette -->
    <!-- Outer left/right lobes -->
    <ellipse cx="20" cy="40" rx="14" ry="18" fill="url(#hw-orange)" />
    <ellipse cx="44" cy="40" rx="14" ry="18" fill="url(#hw-orange)" />

    <!-- Inner lobes -->
    <ellipse cx="26" cy="40" rx="13" ry="19" fill="url(#hw-orange)" />
    <ellipse cx="38" cy="40" rx="13" ry="19" fill="url(#hw-orange)" />

    <!-- Center lobe -->
    <ellipse cx="32" cy="40" rx="11" ry="19.5" fill="url(#hw-orange)" />

    <!-- Subtle rib shadow lines -->
    <path d="M26 21c-4 5-6 12-6 19s2 14 6 19" fill="none" stroke="#9a3412" stroke-width="1.2" opacity="0.45" />
    <path d="M38 21c4 5 6 12 6 19s-2 14-6 19" fill="none" stroke="#9a3412" stroke-width="1.2" opacity="0.45" />

    <!-- Top glossy highlight -->
    <path d="M22 26c3-4 12-5 20-2" fill="none" stroke="#ffedd5" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
