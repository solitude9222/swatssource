<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Halloween">
  <defs>
    <!-- Outer supernatural aura glow -->
    <filter id="hw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Rich 3D pumpkin body gradient -->
    <radialGradient id="hw-body" cx="45%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="92%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <!-- Fiery inner glow for carved face -->
    <radialGradient id="hw-fire" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
    <!-- Stem gradient -->
    <linearGradient id="hw-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <!-- Side lobe shadow -->
    <linearGradient id="hw-shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Ambient magical glow disc -->
  <circle cx="32" cy="38" r="23" fill="#ea580c" opacity="0.22" filter="url(#hw-glow)" />

  <!-- Twisted gnarled stem with leaf tendril -->
  <path d="M30 18c-1-6 2-12 7-14 1 2 0 5-1 7 3-1 6 0 7 2-2 3-5 4-8 5l-5 0Z" fill="url(#hw-stem)" />
  <path d="M34 14c-1-3 1-6 3-8" fill="none" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Left and right outer lobes for realistic pumpkin silhouette -->
  <ellipse cx="19" cy="38" rx="14" ry="19" fill="url(#hw-body)" />
  <ellipse cx="45" cy="38" rx="14" ry="19" fill="url(#hw-body)" />

  <!-- Inner middle lobes -->
  <ellipse cx="25" cy="38" rx="13" ry="20" fill="url(#hw-body)" />
  <ellipse cx="39" cy="38" rx="13" ry="20" fill="url(#hw-body)" />

  <!-- Center front lobe -->
  <ellipse cx="32" cy="38" rx="12" ry="21" fill="url(#hw-body)" />

  <!-- Soft shadow blend across body -->
  <ellipse cx="32" cy="38" rx="25" ry="21" fill="url(#hw-shade)" />

  <!-- Glossy curved top highlight -->
  <path d="M18 26c4-5 18-7 28-2" fill="none" stroke="#ffedd5" stroke-width="2" stroke-linecap="round" opacity="0.45" />

  <!-- Carved Fiery Glowing Eyes with Menacing Angle -->
  <g filter="url(#hw-glow)">
    <!-- Left Eye -->
    <path d="M17 33c3-3 8-4 10-2l-1 8c-3 0-7-2-9-6Z" fill="url(#hw-fire)" />
    <!-- Right Eye -->
    <path d="M47 33c-3-3-8-4-10-2l1 8c3 0 7-2 9-6Z" fill="url(#hw-fire)" />
    <!-- Center Nose Triangle -->
    <polygon points="32,37 28.5,43 35.5,43" fill="url(#hw-fire)" />

    <!-- Wicked Jagged Glowing Grin -->
    <path d="M16 45c3 7 13 12 16 12s13-5 16-12c-2 2-4 3-7 3l-1-4-4 2-2-3-2 3-4-2-1 4c-3 0-5-1-7-3Z" fill="url(#hw-fire)" />
  </g>

  <!-- Glowing Embers Float -->
  <circle cx="12" cy="22" r="1.2" fill="#fbbf24" opacity="0.8" />
  <circle cx="53" cy="20" r="1.5" fill="#f97316" opacity="0.9" filter="url(#hw-glow)" />
  <circle cx="48" cy="12" r="1" fill="#fde047" opacity="0.85" />
</svg>
