<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Halloween Event Badge">
  <defs>
    <!-- Background Pumpkin Radial Gradient -->
    <radialGradient id="hw-body" cx="48%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- Glowing Eye & Mouth Fire Gradient -->
    <linearGradient id="hw-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="hw-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="60%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- Internal Fire Filter Glow -->
    <filter id="hw-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Pumpkin Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="4" fill="#000000" opacity="0.4" />

  <!-- Pumpkin Stem with leaf curl -->
  <path d="M30 18c-1-7 3-12 8-14 0.5 2.5-0.5 5.5-1.5 7.5 2.5-1 4.5 0 5.5 2-2 3-4 4-7 4.5l-5 0Z" fill="url(#hw-stem)" />
  <path d="M33 11c1.5-2 3-3 5-3.5" fill="none" stroke="#a3e635" stroke-width="1" stroke-linecap="round" opacity="0.6" />

  <!-- Outer Lobes -->
  <ellipse cx="18" cy="38" rx="13" ry="17" fill="url(#hw-body)" />
  <ellipse cx="46" cy="38" rx="13" ry="17" fill="url(#hw-body)" />

  <!-- Mid Lobes -->
  <ellipse cx="24" cy="39" rx="12" ry="18" fill="url(#hw-body)" />
  <ellipse cx="40" cy="39" rx="12" ry="18" fill="url(#hw-body)" />

  <!-- Center Lobe -->
  <ellipse cx="32" cy="39" rx="10.5" ry="18.5" fill="url(#hw-body)" />

  <!-- Subtle Grooves for 3D Volume -->
  <path d="M24 21c-4 5-6 12-6 18s2 13 6 18" fill="none" stroke="#7c2d12" stroke-width="1.2" opacity="0.4" />
  <path d="M40 21c4 5 6 12 6 18s-2 13-6 18" fill="none" stroke="#7c2d12" stroke-width="1.2" opacity="0.4" />

  <!-- Top Curved Gloss Highlight -->
  <path d="M22 25c3-3 14-4 20-1" fill="none" stroke="#ffedd5" stroke-width="1.6" stroke-linecap="round" opacity="0.5" />

  <!-- Carved Fiery Eyes, Nose, and Grin -->
  <g filter="url(#hw-bloom)">
    <!-- Left Triangular Eye -->
    <polygon points="20,31 29,33 23,39" fill="url(#hw-glow)" />
    <!-- Right Triangular Eye -->
    <polygon points="44,31 35,33 41,39" fill="url(#hw-glow)" />
    <!-- Center Nose -->
    <polygon points="32,36 29,42 35,42" fill="url(#hw-glow)" />
    <!-- Wicked Carved Smile with Teeth -->
    <path d="M19 45c3 6 8 9 13 9s10-3 13-9c-2.5 1.5-4 2-6 2l-1-2.5-3 1.5-3-1.5-3 1.5-1-2.5c-2 0-3.5-0.5-6-2Z" fill="url(#hw-glow)" />
  </g>

  <!-- Sparkle Speculars in Eyes -->
  <circle cx="24" cy="34" r="0.8" fill="#ffffff" />
  <circle cx="40" cy="34" r="0.8" fill="#ffffff" />
</svg>
